[package]
name = "app"
# Not the app version: that lives in package.json (tauri.conf.json points at it).
version = "0.0.0"
description = "Seasonal anime collage maker"
authors = ["muzi-xiaoren"]
license = "Apache-2.0"
repository = "https://github.com/muzi-xiaoren/AniAni"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-persisted-scope = "2"
